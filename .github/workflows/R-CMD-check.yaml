# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    concurrency:
      group: check-${{ github.event_name != 'pull_request' || github.run_id }}
      cancel-in-progress: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # The registry and the QML corpus are two extractions of the same
      # upstream styles, and the whole point of shipping both is that they
      # cannot drift apart silently. Every guard that enforces that -- index
      # integrity in both directions, the slugifier agreement, the positional
      # <flags> assertion -- lived only on a developer's machine until this
      # workflow existed, because pkgdown was the repo's only CI and it runs no
      # tests.
      #
      # The byte-identity check against rfp still skips here: rfp is private and
      # unavailable to this runner. That is why the structural assertions beside
      # it do not depend on rfp -- they are what runs unattended.
      # error-on "error", not the action's default of "warning".
      #
      # main already carries two WARNINGs that predate this workflow -- em
      # dashes in three string literals (roxygen comments are exempt, code is
      # not), and five demo datasets with no roxygen in R/data.R. Neither is a
      # correctness problem and neither belongs to the change that added CI, so
      # defaulting to warning would land a check that is red on arrival and
      # that nobody can make green. A gate everyone learns to ignore is worse
      # than no gate.
      #
      # This still fails on what the workflow exists for: a test failure is an
      # ERROR in `checking tests`, so every corpus guard gates the build.
      # Tighten to "warning" once #51 clears the two, and the gate gets
      # strictly stronger rather than being relaxed by default.
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: '"error"'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
