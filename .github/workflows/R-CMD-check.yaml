# R CMD check on every pull request and every push to main.
#
# The job is New Graph Environment's shared workflow, so a runner, a timeout or a step
# changes in one place: https://github.com/NewGraphEnvironment/flows
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    uses: NewGraphEnvironment/flows/.github/workflows/r-cmd-check.yaml@v1
    with:
      # error-on "error" until #51 clears two WARNINGs that predate this workflow; a test
      # failure is still an ERROR, so every corpus guard gates the build. Compacted vignettes,
      # as before.
      error-on: '"error"'
      build-args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
